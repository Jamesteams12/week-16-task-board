<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="title">
        <h1>Task Manager</h1>
        <small>Use this to keep track on what needs to be done. From need to do, busy with it and complete.</small>
        <div class="quote">

        </div>
    </div>
    <hr >
    <form id="todo-form">
        <input id="todo-input" type="text" placeholder="Enter Tasks here" required>
        <button type="submit">Add</button>
    </form>
    <div class="task-holder">
        <div id="to-do">
            <h2><u>To-Do</u></h2>
        </div>
        <div id="busy">
            <h2><u>In progress</u></h2>

        </div>
        <div id="done">
            <h2><u>complete</u></h2>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
